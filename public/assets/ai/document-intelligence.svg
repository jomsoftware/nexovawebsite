37" text-anchor="start">Maria Santos</text><line x1="420" y1="246" x2="750" y2="246" stroke="#c9d6df" stroke-width="2"/><text x="440" y="224" font-size="17" font-weight="600" fill="#46525c" text-anchor="start">Date</text><text x="570" y="224" font-size="17" font-weight="700" fill="#0b2237" text-anchor="start">12 Oct 2026</text><line x1="420" y1="302" x2="750" y2="302" stroke="#c9d6df" stroke-width="2"/><text x="440" y="280" font-size="17" font-weight="600" fill="#46525c" text-anchor="start">Amount</text><text x="570" y="280" font-size="17" font-weight="700" fill="#0b2237" text-anchor="start">PHP 18,450</text><line x1="420" y1="358" x2="750" y2="358" stroke="#c9d6df" stroke-width="2"/><text x="440" y="336" font-size="17" font-weight="600" fill="#46525c" text-anchor="start">Stamp</text><rect x="570" y="315" width="160" height="32" rx="16" fill="#e8a317"/><text x="650" y="337" font-size="15" font-weight="700" fill="#0b2237" text-anchor="middle">Needs a person</text><text x="585" y="420" font-size="16" font-weight="500" fill="#46525c" text-anchor="middle">It reads. A person checks what it is unsure of.</text></svg>
